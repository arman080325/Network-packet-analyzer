    <text x="170" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="500" fill="#8493B2" text-anchor="start" xml:space="preserve" textLength="392.0" lengthAdjust="spacingAndGlyphs" >weighted alerts → per-host risk · scores decay over time</text>
    <circle cx="850" cy="38" r="5" fill="#FF3E6C"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle>
