      <text x="830" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#FFB13C" text-anchor="start" xml:space="preserve" textLength="30.0" lengthAdjust="spacingAndGlyphs" > 31</text>
      <rect x="872" y="197" width="94" height="22" rx="11" fill="#FFB13C" fill-opacity=".13" stroke="#FFB13C" stroke-opacity=".6"/>
