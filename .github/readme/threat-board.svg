      <text x="830" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#31F2A0" text-anchor="start" xml:space="preserve" textLength="30.0" lengthAdjust="spacingAndGlyphs" >  8</text>
