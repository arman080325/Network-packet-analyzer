      <text x="40" y="229" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="500" fill="#8493B2" text-anchor="start" xml:space="preserve" textLength="147.2" lengthAdjust="spacingAndGlyphs" >DNS high-entropy labels</text>
