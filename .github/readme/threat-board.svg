<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Threat board: hosts ranked by weighted, time-decaying risk scores">
  <title>NetScope threat board</title>
  <style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#111C30" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowG"><stop offset="0" stop-color="#31F2A0" stop-opacity=".28"/><stop offset="1" stop-color="#31F2A0" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#8C6BFF" stop-opacity=".22"/><stop offset="1" stop-color="#8C6BFF" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><linearGradient id="bar0" x1="0" x2="1"><stop offset="0" stop-color="#FF3E6C" stop-opacity=".35"/><stop offset="1" stop-color="#FF3E6C"/></linearGradient><linearGradient id="bar1" x1="0" x2="1"><stop offset="0" stop-color="#FFB13C" stop-opacity=".35"/><stop offset="1" stop-color="#FFB13C"/></linearGradient><linearGradient id="bar2" x1="0" x2="1"><stop offset="0" stop-color="#FFB13C" stop-opacity=".35"/><stop offset="1" stop-color="#FFB13C"/></linearGradient><linearGradient id="bar3" x1="0" x2="1"><stop offset="0" stop-color="#31F2A0" stop-opacity=".35"/><stop offset="1" stop-color="#31F2A0"/></linearGradient><clipPath id="card"><rect width="1000" height="330" rx="18"/></clipPath></defs>
  <g clip-path="url(#card)">
