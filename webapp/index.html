<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NetScope — Network Packet Analyzer & Security Platform</title>
  <meta name="description" content="Production-quality network observability, packet intelligence, and anomaly detection interface." />
  <meta name="theme-color" content="#0b1020" />
  
  <link rel="icon" type="image/svg+xml" href="favicon-tile.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png" />
  <link rel="manifest" href="site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Screen Reader Announcements -->
  <div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Skip Navigation -->
  <a href="#page-content" class="skip-link">Skip to main content</a>

  <!-- SVG Icon Definitions (Matching approved Figma Icons) -->
  <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#19b89a" stop-opacity="0.28" />
        <stop offset="100%" stop-color="#19b89a" stop-opacity="0" />
      </linearGradient>

      <g id="icon-grid"><path fill="currentColor" d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></g>
      <g id="icon-activity"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 12h4l2.5-7 5 14 2.5-7h4"/></g>
      <g id="icon-packet"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3l9 5-9 5-9-5 9-5zm-9 9l9 5 9-5M3 16l9 5 9-5"/></g>
      <g id="icon-network"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 5v4m0 6v4M5 12h14M5 9v6m14-6v6M9 9h6v6H9zM3 7h4v2H3zm0 8h4v2H3zm14-8h4v2h-4zm0 8h4v2h-4z"/></g>
      <g id="icon-server"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01"/></g>
      <g id="icon-flow"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 5h6v6H5zM13 13h6v6h-6zM11 8h4a2 2 0 012 2v3M8 11v4a2 2 0 002 2h3"/></g>
      <g id="icon-shield"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3l8 3v5c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-3zm-3 9l2 2 4-5"/></g>
      <g id="icon-alert"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3l10 18H2L12 3zm0 6v5m0 3h.01"/></g>
      <g id="icon-lock"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 10h12v10H6zM8 10V7a4 4 0 018 0v3"/></g>
      <g id="icon-chart"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></g>
      <g id="icon-report"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6m-6 4h6"/></g>
      <g id="icon-sliders"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 6h10m4 0h2M4 12h2m4 0h10M4 18h7m4 0h5M14 4v4M6 10v4m5 2v4"/></g>
      <g id="icon-settings"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 9a3 3 0 100 6 3 3 0 000-6zm8 3l2-1-2-4-2 .5-2-1-1-2h-5l-1 2-2 1L5 7l-2 4 2 1v2l-2 1 2 4 2-.5 2 1 1 2h5l1-2 2-1 2 .5 2-4-2-1z"/></g>
      <g id="icon-book"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 5a3 3 0 013-2h5v17H7a3 3 0 00-3 1zm16 0a3 3 0 00-3-2h-5v17h5a3 3 0 013 1z"/></g>
      <g id="icon-search"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M10.5 4a6.5 6.5 0 100 13 6.5 6.5 0 000-13zm5 11.5L21 21"/></g>
      <g id="icon-bell"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 9a6 6 0 0112 0c0 7 3 7 3 8H3c0-1 3-1 3-8m4 11h4"/></g>
      <g id="icon-sun"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 8a4 4 0 100 8 4 4 0 000-8zm0-6v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>
      <g id="icon-chevron"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/></g>
      <g id="icon-pause"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 5v14m8-14v14"/></g>
      <g id="icon-play"><path fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M7 4l13 8-13 8z"/></g>
      <g id="icon-filter"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 5h18l-7 8v6l-4 2v-8z"/></g>
      <g id="icon-download"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m-5-5l5 5 5-5M4 19h16"/></g>
      <g id="icon-more"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h.01M12 12h.01M19 12h.01"/></g>
      <g id="icon-clock"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3a9 9 0 100 18 9 9 0 000-18zm0 4v5l3 2"/></g>
      <g id="icon-x"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18"/></g>
      <g id="icon-check"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12l4 4L19 6"/></g>
      <g id="icon-upload"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m-5 5l5-5 5 5M4 16v4h16v-4"/></g>
      <g id="icon-radio"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 12h.01M8.5 8.5a5 5 0 000 7m7-7a5 5 0 010 7M5.5 5.5a9 9 0 000 13m0-13a9 9 0 010 13"/></g>
      <g id="icon-copy"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 4v12a2 2 0 002 2h8a2 2 0 002-2V7.5L16.5 4H10a2 2 0 00-2 2zM4 8v12a2 2 0 002 2h8"/></g>
    </defs>
  </svg>

  <div id="app-root" class="app dark">
    <!-- Desktop & Mobile Sidebar Navigation -->
    <aside id="app-sidebar" class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
        <b>Net<span>Scope</span></b>
        <button id="sidebar-collapse-btn" class="collapse-btn" type="button" aria-label="Toggle sidebar collapse" title="Toggle sidebar">
          <svg width="16" height="16"><use href="#icon-chevron" /></svg>
        </button>
      </div>

      <nav id="sidebar-nav">
        <!-- Rendered dynamically by app.js -->
      </nav>

      <div id="sidebar-conn-card" class="sidebar-connection" role="button" tabindex="0" title="Configure connection">
        <div>
          <span id="sidebar-conn-dot" class="online-dot demo"></span>
          <b id="sidebar-conn-title">Backend connected</b>
        </div>
        <p id="sidebar-conn-subtitle">Demo mode · 18 pps</p>
      </div>
    </aside>

    <!-- Backdrop for mobile drawer -->
    <button id="sidebar-backdrop" class="backdrop" hidden aria-label="Close navigation overlay"></button>

    <!-- Main Shell -->
    <div class="main-shell">
      <header class="topbar">
        <div class="top-left">
          <button id="mobile-menu-btn" class="mobile-menu-btn" type="button" aria-label="Open navigation menu">
            <svg width="18" height="18"><use href="#icon-grid" /></svg>
          </button>
          <div id="top-current-icon" class="current-icon" aria-hidden="true">
            <svg width="18" height="18"><use href="#icon-activity" /></svg>
          </div>
          <b id="top-current-title">Live Traffic</b>
        </div>

        <label class="global-search" for="global-search-input">
          <svg width="16" height="16" aria-hidden="true"><use href="#icon-search" /></svg>
          <input id="global-search-input" type="text" placeholder="Search packets, hosts or alerts…" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>

        <div class="top-actions">
          <span id="top-status-badge" class="badge good"><i></i> Connected</span>
          <span id="top-mode-badge" class="badge purple"><i></i> Demo mode</span>

          <button id="btn-notifications" class="icon-btn" type="button" aria-label="Security alerts" title="12 alerts recorded">
            <svg width="18" height="18"><use href="#icon-bell" /></svg>
            <i id="notif-dot"></i>
          </button>
          <button id="btn-theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark/light theme" title="Toggle theme">
            <svg width="18" height="18"><use href="#icon-sun" /></svg>
          </button>
          <button id="btn-top-settings" class="icon-btn" type="button" aria-label="Settings" title="Settings">
            <svg width="18" height="18"><use href="#icon-settings" /></svg>
          </button>
        </div>
      </header>

      <!-- Active Page Content -->
      <main id="page-content" class="page-content">
        <!-- Rendered by app.js based on active route -->
      </main>

      <footer class="app-footer">
        <span>NetScope · Network observability &amp; packet intelligence</span>
        <span id="footer-conn-info">Backend connected · v2.0</span>
      </footer>
    </div>
  </div>

  <!-- Connection Configuration Dialog -->
  <dialog id="conn-dialog">
    <div style="padding: 20px; background: var(--surface); color: var(--text); border-radius: var(--radius); border: 1px solid var(--border); min-width: 320px; max-width: 480px;">
      <h3 style="margin: 0 0 8px; font-size: 15px;">Backend Connection</h3>
      <p style="margin: 0 0 16px; color: var(--muted); font-size: 11px;">Specify the WebSocket URL for the live NetScope stream.</p>
      
      <label class="field" style="margin-bottom: 16px;">
        <span>WebSocket URL</span>
        <input id="conn-url-input" type="text" placeholder="ws://localhost:8080/ws or wss://..." autocomplete="off" />
      </label>

      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="conn-dialog-cancel" class="btn ghost" type="button">Cancel</button>
        <button id="conn-dialog-save" class="btn primary" type="button">Save &amp; Connect</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
